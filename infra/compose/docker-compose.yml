name: sbf-tcg-runtime

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  gateway:
    build:
      context: ../..
      dockerfile: apps/gateway/Dockerfile
    environment:
      SERVICE_NAME: gateway
      ENV_PROFILE: docker
    ports:
      - "4010:4010"
    depends_on:
      auth-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4010/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  auth-service:
    build:
      context: ../..
      dockerfile: apps/auth-service/Dockerfile
    environment:
      SERVICE_NAME: auth-service
      ENV_PROFILE: docker
    ports:
      - "4011:4011"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4011/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  catalog-service:
    build:
      context: ../..
      dockerfile: apps/catalog-service/Dockerfile
    environment:
      SERVICE_NAME: catalog-service
      ENV_PROFILE: docker
      ADMIN_API_KEY: change_me_admin_key
    ports:
      - "4012:4012"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4012/health"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
