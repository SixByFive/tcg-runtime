name: SBF-TCG-Runtime

# Add host.docker.internal → host gateway for ALL services on Linux Docker
x-host-gateway: &host-gateway
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  mailpit:
    container_name: Mailpit
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    mem_limit: 64m
    mem_reservation: 16m

  redis:
    container_name: Redis
    image: redis:7-alpine
    restart: unless-stopped
    # Remove this if Redis does not need to be accessible from the host
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    mem_limit: 192m
    mem_reservation: 64m
    command: >
      redis-server
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  gateway:
    <<: *host-gateway
    container_name: Gateway
    build:
      context: ../..
      dockerfile: apps/gateway/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: gateway
      ENV_PROFILE: docker
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=200
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      AUTH_SERVICE_URL: http://auth-service:4011
      CATALOG_SERVICE_URL: http://catalog-service:4012
      COLLECTIONS_SERVICE_URL: http://collections-service:4013
      MARKETPLACE_SERVICE_URL: http://marketplace-service:4014
      TRADING_SERVICE_URL: http://trading-service:4015
      NOTIFICATIONS_SERVICE_URL: http://notifications-service:4016
      MEDIA_SERVICE_URL: http://media-service:4017
      PAYMENTS_SERVICE_URL: http://payments-service:4019
      USER_SERVICE_URL: http://user-service:4021
      MESSAGING_SERVICE_URL: http://messaging-service:4022
      SHIPPING_SERVICE_URL: http://shipping-service:4023
      DOCKER_MGMT_SERVICE_URL: http://docker-mgmt:4030
      MAIL_MGMT_SERVICE_URL: http://host.docker.internal:4031
    ports:
      - "4010:4010"
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      messaging-service:
        condition: service_healthy
      trading-service:
        condition: service_healthy
      payments-service:
        condition: service_healthy
    mem_limit: 256m
    mem_reservation: 128m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4010/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  auth-service:
    <<: *host-gateway
    container_name: Auth
    build:
      context: ../..
      dockerfile: apps/auth-service/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: auth-service
      ENV_PROFILE: docker
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=200
      DISCORD_TOKEN_SECRET: ${DISCORD_TOKEN_SECRET:-}
      APP_URL: ${APP_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@sixbyfive.app}
    expose:
      - "4011"
    depends_on:
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    mem_limit: 256m
    mem_reservation: 128m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4011/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  user-service:
    <<: *host-gateway
    container_name: Users
    build:
      context: ../..
      dockerfile: apps/user-service/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: user-service
      ENV_PROFILE: docker
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=200
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_TOKEN_SECRET: ${DISCORD_TOKEN_SECRET:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    expose:
      - "4021"
    mem_limit: 256m
    mem_reservation: 128m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4021/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  catalog-service:
    <<: *host-gateway
    container_name: Catalog
    build:
      context: ../..
      dockerfile: apps/catalog-service/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: catalog-service
      ENV_PROFILE: docker
      ADMIN_API_KEY: ${ADMIN_API_KEY:-change_me_admin_key}
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=256
    ports:
      - "4012:4012"
    mem_limit: 320m
    mem_reservation: 160m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4012/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  collections-service:
    <<: *host-gateway
    container_name: Collections
    build:
      context: ../..
      dockerfile: apps/collections-service/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: collections-service
      ENV_PROFILE: docker
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=200
    expose:
      - "4013"
    mem_limit: 256m
    mem_reservation: 128m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4013/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  media-service:
    <<: *host-gateway
    container_name: Media
    build:
      context: ../..
      dockerfile: apps/media-service/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: media-service
      ENV_PROFILE: docker
      UPLOAD_DIR: /var/uploads
      SHARP_CONCURRENCY: "1"
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=256
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-}
    expose:
      - "4017"
    volumes:
      - media_uploads:/var/uploads
    mem_limit: 320m
    mem_reservation: 160m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4017/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  notifications-service:
    <<: *host-gateway
    container_name: Notifications
    build:
      context: ../..
      dockerfile: apps/notifications-service/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: notifications-service
      ENV_PROFILE: docker
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=200
      APP_URL: ${APP_URL:-https://tcg.sixbyfive.com}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@sixbyfive.app}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    expose:
      - "4016"
    depends_on:
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    mem_limit: 256m
    mem_reservation: 128m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4016/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  messaging-service:
    <<: *host-gateway
    container_name: Messaging
    build:
      context: ../..
      dockerfile: apps/messaging-service/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: messaging-service
      ENV_PROFILE: docker
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=200
    expose:
      - "4022"
    depends_on:
      notifications-service:
        condition: service_healthy
      realtime-service:
        condition: service_healthy
    mem_limit: 256m
    mem_reservation: 128m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4022/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  trading-service:
    <<: *host-gateway
    container_name: Trading
    build:
      context: ../..
      dockerfile: apps/trading-service/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: trading-service
      ENV_PROFILE: docker
      PROOF_DIR: /var/uploads/trade_proofs
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=200
    expose:
      - "4015"
    volumes:
      - media_uploads:/var/uploads
    depends_on:
      notifications-service:
        condition: service_healthy
    mem_limit: 256m
    mem_reservation: 128m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4015/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  marketplace-service:
    <<: *host-gateway
    container_name: Marketplace
    build:
      context: ../..
      dockerfile: apps/marketplace-service/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: marketplace-service
      ENV_PROFILE: docker
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=200
    expose:
      - "4014"
    volumes:
      - media_uploads:/var/uploads
    depends_on:
      notifications-service:
        condition: service_healthy
    mem_limit: 256m
    mem_reservation: 128m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4014/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  realtime-service:
    <<: *host-gateway
    container_name: Realtime
    build:
      context: ../..
      dockerfile: apps/realtime-service/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: realtime-service
      ENV_PROFILE: docker
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=148
    ports:
      - "4018:4018"
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 192m
    mem_reservation: 96m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4018/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker-service:
    <<: *host-gateway
    container_name: Worker
    build:
      context: ../..
      dockerfile: apps/worker-service/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: worker-service
      ENV_PROFILE: docker
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=148
    expose:
      - "4020"
    depends_on:
      notifications-service:
        condition: service_healthy
    mem_limit: 192m
    mem_reservation: 96m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4020/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  payments-service:
    <<: *host-gateway
    container_name: Payments
    build:
      context: ../..
      dockerfile: apps/payments-service/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: payments-service
      ENV_PROFILE: docker
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=200
    expose:
      - "4019"
    depends_on:
      notifications-service:
        condition: service_healthy
    mem_limit: 256m
    mem_reservation: 128m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4019/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  shipping-service:
    <<: *host-gateway
    container_name: Shipping
    build:
      context: ../..
      dockerfile: apps/shipping-service/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: shipping-service
      ENV_PROFILE: docker
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=148
      SHIPPING_SERVICE_PUBLIC_URL: https://backendtcg.sixbyfive.com
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    expose:
      - "4023"
    depends_on:
      notifications-service:
        condition: service_healthy
    mem_limit: 192m
    mem_reservation: 96m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4023/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  discord-bot:
    <<: *host-gateway
    container_name: DiscordBot
    build:
      context: ../..
      dockerfile: apps/discord-bot/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 4001
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_PUBLIC_KEY: ${DISCORD_PUBLIC_KEY}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI}
      DISCORD_REQUIRED_PERMS: ${DISCORD_REQUIRED_PERMS:-}
      DISCORD_LINK_ROLE_ID: ${DISCORD_LINK_ROLE_ID:-}
      DB_HOST: host.docker.internal
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-sixbyfiv_tcgstand}
      DB_USER: ${DB_USER:-}
      DB_PASS: ${DB_PASS:-}
      BACKEND_GRAPHQL_URL: http://gateway:4010/graphql
      BACKEND_REST_URL: http://gateway:4010
      WEB_APP_URL: ${WEB_APP_URL:-https://tcg.sixbyfive.com}
      SBF_API_KEY: ${SBF_API_KEY:-}
      BRAND_COLOR: ${BRAND_COLOR:-#4169f4}
    expose:
      - "4001"
    depends_on:
      gateway:
        condition: service_healthy
    mem_limit: 256m
    mem_reservation: 128m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4001/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  docker-mgmt:
    container_name: DockerMgmt
    build:
      context: ../..
      dockerfile: apps/docker-mgmt/Dockerfile
    restart: unless-stopped
    environment:
      ADMIN_API_KEY: ${ADMIN_API_KEY:-change_me_admin_key}
      CONTAINER_NAME: DockerMgmt
      NODE_ENV: production
    expose:
      - "4030"
    volumes:
      # Read-write access to the Docker socket — needed for start/stop/restart
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 128m
    mem_reservation: 32m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4030/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  mail-mgmt:
    container_name: MailMgmt
    build:
      context: ../..
      dockerfile: apps/mail-mgmt/Dockerfile
    restart: unless-stopped
    # Mailcow's nginx publishes 127.0.0.1:8080/8443 — loopback-only, so it
    # rejects connections arriving from the docker bridge gateway IP
    # (host.docker.internal). Host networking makes our 127.0.0.1 the real
    # host loopback, so the SOGo connect call actually reaches it.
    network_mode: host
    environment:
      SERVICE_NAME: mail-mgmt
      ADMIN_API_KEY: ${ADMIN_API_KEY:-change_me_admin_key}
      MAIL_ENCRYPTION_KEY: ${MAIL_ENCRYPTION_KEY:-}
      SOGO_CONNECT_URL: ${SOGO_CONNECT_URL:-http://127.0.0.1:8080/SOGo/connect}
      MAILBOX_STORE_PATH: /data/mailboxes.enc.json
      PORT: "4031"
      NODE_ENV: production
    volumes:
      - mail_mgmt_data:/data
    mem_limit: 128m
    mem_reservation: 32m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4031/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  redis_data:
  media_uploads:
  mail_mgmt_data:
