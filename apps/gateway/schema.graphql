# ─── Bulk-lot inputs ──────────────────────────────────────────────────────────
# One listing representing a whole lot (either tracked from the seller's own
# collection or a seller-declared random lot). Forwarded to the marketplace
# service's POST /listings endpoint — see apps/marketplace-service/src/routes/listings.js.

input CreateBulkLotInput {
  listingKind: ListingKind!
  title: String!
  description: String
  price: Float!
  currency: String

  # Condition range covers the whole lot
  conditionMin: String!
  conditionMax: String!
  cardCount: Int!

  guaranteedInclusions: [GuaranteedInclusionInput!]

  # Shipping
  parcelSize: String
  labelPaidBy: String
  shippingType: String
  shippingPrice: Float

  allowOffers: Boolean

  # BULK_TRACKED only — the actual card rows that make up the lot
  items: [BulkLotItemInput!]

  # BULK_RANDOM only — either a pre-uploaded path or a base64 data URL
  lotPhotoPath: String
  lotPhotoBase64: String
}

input BulkLotItemInput {
  cardId: String!
  variant: String
  condition: String
  quantity: Int
}

input GuaranteedInclusionInput {
  description: String!
  quantity: Int!
}

